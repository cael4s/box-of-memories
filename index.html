<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories - AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js NFT tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status">Camera wordt gestart...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; alpha: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- Afbeelding laden -->
    <a-assets>
      <img
        id="scary-image"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- NFT-marker -->
    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <!--
        De afbeelding verschijnt bij de marker.
        De afmetingen zijn voorlopig 100 x 100.
      -->
      <a-plane
        id="scary-overlay"
        position="0 0 1"
        rotation="90 0 0"
        width="100"
        height="100"
        material="
          shader: flat;
          side: double;
          transparent: true;
          opacity: 0;
        "
        visible="false"
      ></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("#foto-marker");
    const overlay = document.querySelector("#scary-overlay");
    const status = document.querySelector("#status");
    const image = document.querySelector("#scary-image");

    const FADE_DURATION = 1200;

    let fadeFrame = null;
    let markerVisible = false;

    // Stel de transparantie rechtstreeks in.
    function setOpacity(value) {
      overlay.setAttribute("material", "opacity", value);
    }

    // Stop een eventuele lopende fade-in.
    function stopFade() {
      if (fadeFrame !== null) {
        cancelAnimationFrame(fadeFrame);
        fadeFrame = null;
      }
    }

    // Fade-in met JavaScript.
    function fadeIn() {
      stopFade();

      markerVisible = true;
      overlay.setAttribute("visible", true);
      setOpacity(0);

      const startTime = performance.now();

      function animate(now) {
        if (!markerVisible) {
          fadeFrame = null;
          return;
        }

        const progress = Math.min(
          (now - startTime) / FADE_DURATION,
          1
        );

        // Soepele fade-in.
        const easedProgress =
          progress * progress * (3 - 2 * progress);

        setOpacity(easedProgress);

        if (progress < 1) {
          fadeFrame = requestAnimationFrame(animate);
        } else {
          fadeFrame = null;
          setOpacity(1);
        }
      }

      fadeFrame = requestAnimationFrame(animate);
    }

    // Marker herkend.
    marker.addEventListener("markerFound", function () {
      if (markerVisible) return;

      status.textContent = "Marker herkend!";
      fadeIn();
    });

    // Marker niet meer zichtbaar.
    marker.addEventListener("markerLost", function () {
      markerVisible = false;
      stopFade();

      setOpacity(0);
      overlay.setAttribute("visible", false);

      status.textContent = "Richt de camera op de foto";
    });

    // Controleer of de afbeelding geladen is.
    image.addEventListener("load", function () {
      status.textContent = "Afbeelding geladen — zoek de marker";
      console.log("Scary-afbeelding succesvol geladen.");
    });

    image.addEventListener("error", function () {
      status.textContent = "Afbeelding kon niet worden geladen";
      console.error("Controleer de URL van de afbeelding.");
    });

    // Status van de camera en AR-scène.
    document.querySelector("a-scene").addEventListener(
      "loaded",
      function () {
        console.log("A-Frame-scène geladen.");
      }
    );

    window.addEventListener("load", function () {
      status.textContent = "Richt de camera op de marker";
    });
  </script>
</body>
</html>
