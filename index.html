```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="status">AR wordt geladen...</div>

  <!-- Afbeelding die als overlay wordt getoond -->
  <img
    id="scary-image"
    src="https://cael4s.github.io/box-of-memories/images/karrekienherken.jpg"
    crossorigin="anonymous"
    style="display: none;"
  >

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <img
        id="scary-texture"
        src="https://cael4s.github.io/box-of-memories/images/karrekienherken.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekienherken"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-plane
        id="scary-overlay"
        position="40 30 0"
        rotation="-90 0 0"
        width="80"
        height="50"
        visible="false"
        material="
          shader: flat;
          src: #scary-texture;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Gebruik hetzelfde topic als in je Python-script.
    const NTFY_TOPIC = "box-of-memories-urk123";

    const statusElement = document.getElementById("status");
    const overlay = document.getElementById("scary-overlay");
    const marker = document.getElementById("foto-marker");

    let fadeAnimation = null;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function fadeNaar(doelOpacity, duur = 800) {
      if (!overlay) return;

      if (fadeAnimation) {
        fadeAnimation.cancel();
      }

      overlay.setAttribute("visible", true);

      const huidigeOpacity =
        Number(overlay.getAttribute("material").opacity) || 0;

      fadeAnimation = overlay.animate(
        [
          { opacity: huidigeOpacity },
          { opacity: doelOpacity }
        ],
        {
          duration: duur,
          easing: "ease-in-out",
          fill: "forwards"
        }
      );

      fadeAnimation.onfinish = () => {
        overlay.setAttribute("material", "opacity", doelOpacity);

        if (doelOpacity === 0) {
          overlay.setAttribute("visible", false);
        }

        fadeAnimation = null;
      };
    }

    function verwerkBericht(bericht) {
      const actie = String(
        bericht.message || bericht
      ).trim().toUpperCase();

      console.log("ntfy-bericht ontvangen:", actie);

      if (actie === "ACCEPT") {
        fadeNaar(1, 800);
        setStatus("Herinnering geopend");
      } else if (actie === "REMEMBER") {
        fadeNaar(0, 800);
        setStatus("Herinnering opgeborgen");
      }
    }

    // Luister naar berichten van het Python-script via ntfy.
    const ntfyUrl =
      `https://ntfy.sh/${NTFY_TOPIC}/sse`;

    const ntfy = new EventSource(ntfyUrl);

    ntfy.onopen = () => {
      setStatus("Verbonden — wacht op knoppen");
      console.log("Verbonden met ntfy");
    };

    ntfy.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        verwerkBericht(data);
      } catch (error) {
        console.error("Bericht kon niet worden gelezen:", error);
      }
    };

    ntfy.onerror = (error) => {
      setStatus("ntfy-verbinding herstellen...");
      console.error("ntfy-verbindingsfout:", error);
    };

    // Status van de NFT-marker.
    marker.addEventListener("loaded", () => {
      console.log("NFT-marker geladen");
    });

    marker.addEventListener("markerFound", () => {
      setStatus("Marker herkend");
      console.log("Marker herkend");
    });

    marker.addEventListener("markerLost", () => {
      setStatus("Richt de camera op de afbeelding");
      console.log("Marker uit beeld");
    });

    // Begin met de overlay verborgen.
    overlay.setAttribute("visible", false);
    overlay.setAttribute("material", "opacity", 0);

    window.addEventListener("load", () => {
      setStatus("Camera en AR worden gestart...");
    });
  </script>
</body>
</html>
