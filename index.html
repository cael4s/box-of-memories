
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Box of Memories - AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 14px;
      max-width: 85%;
    }
  </style>
</head>

<body>
  <div id="status">Verbinden met ntfy...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; colorManagement: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <img
        id="scary-image"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-plane
        id="scary-overlay"
        position="40 30 0"
        rotation="-90 0 0"
        width="80"
        height="50"
        visible="false"
        material="
          shader: flat;
          src: #scary-image;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ==========================================
    // INSTELLINGEN
    // ==========================================

    const NTFY_TOPIC = "box-of-memories-urk123";
    const NTFY_URL =
      `https://ntfy.sh/${NTFY_TOPIC}/json?since=now`;

    const marker = document.querySelector("#foto-marker");
    const overlay = document.querySelector("#scary-overlay");
    const status = document.querySelector("#status");

    const FADE_DURATION = 1200;

    let plaagActief = false;
    let markerZichtbaar = false;
    let animationToken = 0;

    function setStatus(tekst) {
      status.textContent = tekst;
    }

    // ==========================================
    // FADE-IN EN FADE-OUT
    // ==========================================

    function fadeNaar(doel) {
      const token = ++animationToken;

      if (doel > 0) {
        overlay.setAttribute("visible", true);
      }

      const material = overlay.getAttribute("material");
      const begin = Number(material.opacity ?? 0);
      const startTime = performance.now();

      function animate(now) {
        if (token !== animationToken) return;

        const voortgang = Math.min(
          (now - startTime) / FADE_DURATION,
          1
        );

        const soepel =
          voortgang * voortgang * (3 - 2 * voortgang);

        const opacity = begin + (doel - begin) * soepel;

        overlay.setAttribute("material", "opacity", opacity);

        if (voortgang < 1) {
          requestAnimationFrame(animate);
        } else {
          overlay.setAttribute("material", "opacity", doel);

          if (doel === 0) {
            overlay.setAttribute("visible", false);
          }
        }
      }

      requestAnimationFrame(animate);
    }

    function updateAR() {
      if (plaagActief && markerZichtbaar) {
        setStatus("ACCEPT — de plaag is begonnen");
        fadeNaar(1);
      } else {
        fadeNaar(0);

        if (plaagActief) {
          setStatus("ACCEPT actief — zoek de marker");
        } else {
          setStatus("REMEMBER — afbeelding verborgen");
        }
      }
    }

    // ==========================================
    // MARKER HERKENNEN
    // ==========================================

    marker.addEventListener("markerFound", () => {
      markerZichtbaar = true;
      updateAR();
    });

    marker.addEventListener("markerLost", () => {
      markerZichtbaar = false;
      updateAR();
    });

    // ==========================================
    // NTfy BERICHTEN ONTVANGEN
    // ==========================================

    async function luisterNaarNtfy() {
      while (true) {
        let reader = null;

        try {
          setStatus("Verbinden met ntfy...");

          const response = await fetch(NTFY_URL, {
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          if (!response.body) {
            throw new Error("Geen stream beschikbaar");
          }

          reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          setStatus("Verbonden — wacht op ACCEPT of REMEMBER");

          while (true) {
            const { value, done } = await reader.read();

            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            const regels = buffer.split("\n");
            buffer = regels.pop() || "";

            for (const regel of regels) {
              if (!regel.trim()) continue;

              let event;

              try {
                event = JSON.parse(regel);
              } catch {
                continue;
              }

              if (event.event !== "message") continue;

              const bericht = String(event.message || "")
                .trim()
                .toUpperCase();

              if (bericht === "ACCEPT") {
                plaagActief = true;
                console.log("ACCEPT ontvangen");
                updateAR();
              }

              if (bericht === "REMEMBER") {
                plaagActief = false;
                console.log("REMEMBER ontvangen");
                updateAR();
              }
            }
          }
        } catch (error) {
          console.error("ntfy-fout:", error);
          setStatus("ntfy tijdelijk niet bereikbaar; opnieuw proberen...");
        } finally {
          if (reader) {
            try {
              await reader.cancel();
            } catch (_) {}
          }
        }

        await new Promise(resolve => setTimeout(resolve, 2000));
      }
    }

    // Afbeelding bij de start verbergen.
    overlay.setAttribute("visible", false);
    overlay.setAttribute("material", "opacity", 0);

    // Begin met luisteren.
    luisterNaarNtfy();
  </script>
</body>
</html>
