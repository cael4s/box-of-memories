```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box of Memories</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/three.js/build/ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .a-enter-vr, .a-enter-ar {
      display: none !important;
    }
  </style>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <img
        id="scaryTexture"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-nft
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-image
        id="scary"
        src="#scaryTexture"
        width="1.6"
        height="1"
        position="0 0 0.01"
        visible="false"
        material="shader: flat; transparent: true; opacity: 0; side: double"
        animation__in="property: material.opacity; from: 0; to: 1; dur: 1500; startEvents: fadein"
        animation__out="property: material.opacity; from: 1; to: 0; dur: 1500; startEvents: fadeout"
      ></a-image>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const scary = document.getElementById("scary");
    const TOPIC = "box-of-memories-urk123";

    const bron = new EventSource(
      "https://ntfy.sh/" + TOPIC + "/sse"
    );

    let verbergTimer;

    bron.onmessage = function (e) {
      const data = JSON.parse(e.data);

      if (data.event !== "message") return;

      if (data.message === "ACCEPT") {
        clearTimeout(verbergTimer);
        scary.setAttribute("visible", true);
        scary.emit("fadein");
      }

      if (data.message === "REMEMBER") {
        scary.emit("fadeout");

        verbergTimer = setTimeout(function () {
          scary.setAttribute("visible", false);
        }, 1500);
      }
    };
  </script>
</body>
</html>
```
