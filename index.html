<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories</title>

  <!-- AR.js and A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <!-- Serif font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-family: Georgia, serif;
      font-size: 14px;
      text-align: center;
    }

    /* Full-screen message */
    #message-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 30px;
      background: rgba(0, 0, 0, 0.78);
      color: #F4EDE2;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1.25;
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #message-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body>
  <div id="status">Starting AR...</div>
  <div id="message-overlay" aria-live="polite"></div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <!-- Original image shown as the AR overlay -->
      <img
        id="scary-texture"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- New NFT marker: used only for recognition -->
    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekienherken"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-plane
        id="scary-overlay"
        position="40 30 0"
        rotation="-90 0 0"
        width="80"
        height="50"
        visible="false"
        material="
          shader: flat;
          src: #scary-texture;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Must match the topic in box_of_memories.py
    const NTFY_TOPIC = "box-of-memories-urk123";

    const statusElement = document.getElementById("status");
    const overlay = document.getElementById("scary-overlay");
    const marker = document.getElementById("foto-marker");
    const messageOverlay = document.getElementById("message-overlay");

    let fadeAnimation = null;
    let messageTimer = null;
    let messageDelayTimer = null;

    // Start in REMEMBER mode
    let currentMode = "REMEMBER";

    function setStatus(message) {
      statusElement.textContent = message;
    }

    // Fade the AR image in or out
    function fadeNaar(targetOpacity, duration = 800) {
      if (!overlay) return;

      if (fadeAnimation) {
        fadeAnimation.cancel();
        fadeAnimation = null;
      }

      const currentOpacity =
        Number(overlay.getAttribute("material").opacity) || 0;

      overlay.setAttribute("visible", true);

      fadeAnimation = overlay.animate(
        [
          { opacity: currentOpacity },
          { opacity: targetOpacity }
        ],
        {
          duration: duration,
          easing: "ease-in-out",
          fill: "forwards"
        }
      );

      fadeAnimation.onfinish = () => {
        overlay.setAttribute("material", "opacity", targetOpacity);

        if (targetOpacity === 0) {
          overlay.setAttribute("visible", false);
        }

        fadeAnimation = null;
      };
    }

    // Wait 3 seconds, show the text for 3 seconds, then hide it
    function showMessageAfterDelay(message) {
      clearTimeout(messageDelayTimer);
      clearTimeout(messageTimer);

      messageOverlay.classList.remove("visible");
      messageOverlay.textContent = "";

      messageDelayTimer = setTimeout(() => {
        messageOverlay.textContent = message;
        messageOverlay.classList.add("visible");

        messageTimer = setTimeout(() => {
          messageOverlay.classList.remove("visible");
        }, 3000);
      }, 3000);
    }

    // Handle messages from the Arduino via Python and ntfy
    function processMessage(data) {
      const action = String(data.message || "")
        .trim()
        .toUpperCase();

      console.log("ntfy message received:", action);

      if (action === "ACCEPT") {
        currentMode = "ACCEPT";

        fadeNaar(1, 800);
        setStatus("Accept — creating something new");

        showMessageAfterDelay(
          "... I take the new and make something out of it"
        );
      } else if (action === "REMEMBER") {
        currentMode = "REMEMBER";

        fadeNaar(0, 800);
        setStatus("Remember — holding on to what once was");

        showMessageAfterDelay(
          "... I hold on to what once was"
        );
      }
    }

    // Connect to ntfy
    const ntfyUrl = `https://ntfy.sh/${NTFY_TOPIC}/sse`;
    const ntfy = new EventSource(ntfyUrl);

    ntfy.onopen = () => {
      if (currentMode === "REMEMBER") {
        setStatus("Remember — holding on to what once was");
      } else {
        setStatus("Connected — waiting for buttons");
      }

      console.log("Connected to ntfy");
    };

    ntfy.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        processMessage(data);
      } catch (error) {
        console.error("Could not read ntfy message:", error);
      }
    };

    ntfy.onerror = (error) => {
      setStatus("Reconnecting to ntfy...");
      console.error("ntfy connection error:", error);
    };

    // NFT marker tracking status
    marker.addEventListener("markerFound", () => {
      if (currentMode === "REMEMBER") {
        setStatus("Remember — holding on to what once was");
      } else {
        setStatus("Marker recognized");
      }
    });

    marker.addEventListener("markerLost", () => {
      setStatus("Point the camera at the image");
    });
