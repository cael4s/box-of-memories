```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: #222;
      color: white;
      padding: 12px;
      font: 16px Arial, sans-serif;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div id="status">
    AR wordt geladen...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- Enge afbeelding laden -->
    <a-assets>
      <img
        id="scary-image"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous">
    </a-assets>

    <!-- Bestaande NFT-marker -->
    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- Bestaande objecten -->
      <a-sphere
        position="100 150 0"
        radius="25"
        color="#8b1e3f">
      </a-sphere>

      <a-sphere
        position="200 220 0"
        radius="18"
        color="#24152f">
      </a-sphere>

      <a-sphere
        position="280 120 0"
        radius="22"
        color="#151515">
      </a-sphere>

      <!--
        Enge afbeelding in de 3D-ruimte.
        Het vlak volgt de perspectiefbeweging van de marker.
        De afmetingen zijn voorlopige waarden.
      -->
      <a-plane
        id="scary-overlay"
        position="200 150 1"
        rotation="0 0 0"
        width="400"
        height="300"
        src="#scary-image"
        visible="false"
        material="shader: flat; side: double;">
      </a-plane>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const marker = document.getElementById("foto-marker");
    const scaryOverlay = document.getElementById("scary-overlay");
    const scaryImage = document.getElementById("scary-image");

    // Controleer of de afbeelding geladen is
    scaryImage.addEventListener("load", function () {
      console.log("Enge afbeelding geladen.");
    });

    scaryImage.addEventListener("error", function () {
      status.textContent =
        "Fout: de enge afbeelding kon niet worden geladen.";
    });

    // AR.js geladen
    window.addEventListener("arjs-nft-loaded", function () {
      status.textContent =
        "Marker geladen! Richt de camera op je foto.";
    });

    // Afbeelding direct zichtbaar zodra de marker wordt herkend
    marker.addEventListener("markerFound", function () {
      scaryOverlay.setAttribute("visible", true);
      status.textContent = "FOTO HERKEND!";
    });

    // Afbeelding verbergen als de marker uit beeld verdwijnt
    marker.addEventListener("markerLost", function () {
      scaryOverlay.setAttribute("visible", false);
      status.textContent = "Foto niet meer zichtbaar.";
    });

    window.addEventListener("error", function (event) {
      status.textContent = "Fout: " + event.message;
    });
  </script>

</body>
</html>
