
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories - AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js NFT tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 14px;
      max-width: 85%;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div id="status">Box of Memories wordt gestart...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; colorManagement: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <img
        id="scary-image"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- NFT-marker -->
    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <!-- Bestaande positie, rotatie en afmetingen -->
      <a-plane
        id="scary-overlay"
        position="40 30 0"
        rotation="-90 0 0"
        width="80"
        height="50"
        visible="false"
        material="
          shader: flat;
          src: #scary-image;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ==========================================
    // INSTELLINGEN
    // ==========================================

    const NTFY_TOPIC = "box-of-memories-urk123";
    const NTFY_URL = `https://ntfy.sh/${NTFY_TOPIC}/sse`;

    const marker = document.querySelector("#foto-marker");
    const overlay = document.querySelector("#scary-overlay");
    const image = document.querySelector("#scary-image");
    const status = document.querySelector("#status");

    const FADE_DURATION = 1200;

    let plaagActief = false;
    let markerZichtbaar = false;
    let animationToken = 0;

    function setStatus(tekst) {
      status.textContent = tekst;
    }

    // ==========================================
    // FADE-IN EN FADE-OUT
    // ==========================================

    function fadeNaar(doel) {
      const token = ++animationToken;

      if (doel > 0) {
        overlay.setAttribute("visible", true);
      }

      const materiaal = overlay.getAttribute("material");
      const begin = Number(materiaal.opacity ?? 0);
      const startTijd = performance.now();

      function animeer(nu) {
        if (token !== animationToken) return;

        const voortgang = Math.min(
          (nu - startTijd) / FADE_DURATION,
          1
        );

        const soepel =
          voortgang * voortgang * (3 - 2 * voortgang);

        const opacity = begin + (doel - begin) * soepel;

        overlay.setAttribute("material", "opacity", opacity);

        if (voortgang < 1) {
          requestAnimationFrame(animeer);
        } else {
          overlay.setAttribute("material", "opacity", doel);

          if (doel === 0) {
            overlay.setAttribute("visible", false);
          }
        }
      }

      requestAnimationFrame(animeer);
    }

    function updateAR() {
      if (plaagActief && markerZichtbaar) {
        setStatus("ACCEPT — de plaag is begonnen");
        fadeNaar(1);
      } else {
        fadeNaar(0);

        if (plaagActief) {
          setStatus("ACCEPT actief — zoek de marker");
        } else {
          setStatus("REMEMBER — afbeelding verborgen");
        }
      }
    }

    // ==========================================
    // MARKER HERKEND OF VERLOREN
    // ==========================================

    marker.addEventListener("markerFound", () => {
      markerZichtbaar = true;
      updateAR();
    });

    marker.addEventListener("markerLost", () => {
      markerZichtbaar = false;
      updateAR();
    });

    // ==========================================
    // NTfy SSE-VERBINDING
    // ==========================================

    function luisterNaarNtfy() {
      setStatus("Verbinden met ntfy...");

      const verbinding = new EventSource(NTFY_URL);

      verbinding.onopen = () => {
        setStatus("Verbonden met ntfy — wacht op knoppen");
        console.log("ntfy-verbinding geopend");
      };

      verbinding.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.event !== "message") return;

          const bericht = String(data.message || "")
            .trim()
            .toUpperCase();

          console.log("ntfy-bericht:", bericht);

          if (bericht === "ACCEPT") {
            plaagActief = true;
            updateAR();
          } else if (bericht === "REMEMBER") {
            plaagActief = false;
            updateAR();
          }
        } catch (fout) {
          console.error("Bericht verwerken mislukt:", fout);
        }
      };

      verbinding.onerror = () => {
        setStatus("ntfy-verbinding herstellen...");
        console.warn("ntfy probeert opnieuw te verbinden");
        // EventSource probeert automatisch opnieuw verbinding te maken.
      };

      return verbinding;
    }

    // ==========================================
    // STARTSTATUS
    // ==========================================

    overlay.setAttribute("visible", false);
    overlay.setAttribute("material", "opacity", 0);

    image.addEventListener("load", () => {
      console.log("AR-afbeelding geladen:", image.src);
    });

    image.addEventListener("error", () => {
      setStatus("De AR-afbeelding kon niet worden geladen.");
      console.error("Afbeelding laden mislukt:", image.src);
    });

    const ntfyVerbinding = luisterNaarNtfy();

    window.addEventListener("pagehide", () => {
      ntfyVerbinding.close();
    });
  </script>
</body>
</html>
