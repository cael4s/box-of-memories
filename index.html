
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box of Memories</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

  <div id="status" style="
    position:fixed; top:10px; left:10px; z-index:9999;
    background:#222; color:white; padding:12px;
    font:16px Arial; border-radius:6px;">
    AR wordt geladen...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <a-sphere position="100 150 0"
        radius="25" color="#8b1e3f"></a-sphere>

      <a-sphere position="200 220 0"
        radius="18" color="#24152f"></a-sphere>

      <a-sphere position="280 120 0"
        radius="22" color="#151515"></a-sphere>

    <a-image
  id="karrekienscary800"
  src="karrekienscary800.jpg"
  width="800" height="600"
  position="400 300 1"
  visible="false">
</a-image>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");

    window.addEventListener("arjs-nft-loaded", function () {
      status.textContent =
        "Marker geladen! Richt de camera op je foto.";
    });

    const marker = document.getElementById("foto-marker");

    marker.addEventListener("markerFound", function () {
      status.textContent = "FOTO HERKEND!";
    });

    marker.addEventListener("markerLost", function () {
      status.textContent = "Foto niet meer zichtbaar.";
    });

    window.addEventListener("error", function (event) {
      status.textContent = "Fout: " + event.message;
    });
    const TOPIC = "box-of-memories-urk123";
const scary = document.getElementById("scary");

const bron = new EventSource("https://ntfy.sh/" + TOPIC + "/sse");

bron.onmessage = function (e) {
  const data = JSON.parse(e.data);
  if (data.event !== "message") return;

  if (data.message === "ACCEPT") {
    scary.setAttribute("visible", "true");
  } else if (data.message === "REMEMBER") {
    scary.setAttribute("visible", "false");
  }
};
  </script>

</body>
</html>
