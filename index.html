
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Box of Memories</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

  <!-- AR.js met NFT-afbeeldingstracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px;
      font: 15px Arial, sans-serif;
      border-radius: 8px;
      text-align: center;
    }

    .arjs-loader {
      position: fixed;
      inset: 0;
      background: #000;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      font: 16px Arial, sans-serif;
    }

    .a-enter-vr {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="arjs-loader" id="loader">
    AR wordt gestart...
  </div>

  <div id="status">Camera en marker starten...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <img
        id="scaryTexture"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- Bestaande NFT-marker: URL bewust behouden -->
    <a-nft
      id="memoryMarker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- Afbeelding in verhouding 800 x 500 -->
      <a-image
        id="scary"
        src="#scaryTexture"
        width="1.6"
        height="1"
        position="0 0 0.01"
        visible="false"
        material="shader: flat; transparent: true; opacity: 0; side: double"
      ></a-image>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>


<script>
  const status = document.getElementById("status");
  const scary = document.getElementById("scary");

  // ===== Arduino-koppeling via ntfy =====
  const TOPIC = "box-of-memories-urk123";

  const bron = new EventSource(
    "https://ntfy.sh/" + TOPIC + "/sse"
  );

  bron.onmessage = function (e) {
    try {
      const data = JSON.parse(e.data);
      if (data.event !== "message") return;

      if (data.message === "ACCEPT") {
        scary.setAttribute("visible", true);
        scary.setAttribute("animation", {
          property: "material.opacity",
          from: 0,
          to: 1,
          dur: 1500,
          easing: "easeInOutQuad"
        });
      }

      if (data.message === "REMEMBER") {
        scary.setAttribute("animation", {
          property: "material.opacity",
          from: 1,
          to: 0,
          dur: 1500,
          easing: "easeInOutQuad"
        });

        setTimeout(function () {
          scary.setAttribute("visible", false);
        }, 1500);
      }
    } catch (err) {
      status.style.display = "block";
      status.textContent = "Fout: " + err.message;
    }
  };
</script>


</body>
</html>
