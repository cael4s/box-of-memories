<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box of Memories</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <div id="loader" style="position:absolute; z-index:10; color:white; background:#222; padding:20px;">
    AR wordt geladen...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-nft
      type="nft"
      url="./markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <a-sphere position="100 150 0" radius="25" color="#24152f"></a-sphere>
      <a-sphere position="200 220 0" radius="18" color="#641b38"></a-sphere>
      <a-sphere position="280 120 0" radius="22" color="#151515"></a-sphere>

    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.addEventListener("arjs-nft-loaded", function () {
      document.getElementById("loader").style.display = "none";
    });
  </script>

</body>
</html>
