
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories</title>

  <!-- Serif font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js NFT tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 3000;
      padding: 10px 14px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }

    #message-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 30px;
      background: rgba(0, 0, 0, 0.78);
      color: white;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(20px, 4.5vw, 38px);
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #message-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="status">Starting AR...</div>

  <div id="message-overlay"></div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <img
        id="scary-texture"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekienherken"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-plane
        id="scary-overlay"
        position="40 30 0"
        rotation="-90 0 0"
        width="80"
        height="50"
        visible="false"
        material="
          shader: flat;
          src: #scary-texture;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const statusElement = document.getElementById("status");
    const messageOverlay = document.getElementById("message-overlay");
    const scaryOverlay = document.getElementById("scary-overlay");

    let currentMode = "REMEMBER";
    let messageTimer = null;
    let fadeTimer = null;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function showMessage(message) {
      if (messageTimer) {
        clearTimeout(messageTimer);
      }

      messageOverlay.textContent = message;
      messageOverlay.classList.add("visible");

      messageTimer = setTimeout(() => {
        messageOverlay.classList.remove("visible");
      }, 3000);
    }

    function setImageOpacity(opacity) {
      scaryOverlay.setAttribute(
        "material",
        "opacity",
        opacity
      );

      scaryOverlay.setAttribute("visible", opacity > 0);
    }

    function fadeImage(targetOpacity, duration = 1000) {
      if (fadeTimer) {
        clearInterval(fadeTimer);
      }

      const startOpacity = Number(
        scaryOverlay.getAttribute("material").opacity || 0
      );

      const startTime = performance.now();

      scaryOverlay.setAttribute("visible", true);

      fadeTimer = setInterval(() => {
        const elapsed = performance.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const opacity =
          startOpacity + (targetOpacity - startOpacity) * progress;

        setImageOpacity(opacity);

        if (progress >= 1) {
          clearInterval(fadeTimer);
          fadeTimer = null;

          if (targetOpacity === 0) {
            scaryOverlay.setAttribute("visible", false);
          }
        }
      }, 30);
    }

    function processMessage(data) {
      let command = "";

      if (typeof data === "string") {
        command = data;
      } else if (data && data.message) {
        command = data.message;
      }

      command = command.trim().toUpperCase();

      console.log("Received message:", command);

      if (command.includes("ACCEPT")) {
        currentMode = "ACCEPT";

        fadeImage(1, 1000);

        setTimeout(() => {
          showMessage("... I embrace the new");
        }, 3000);

      } else if (command.includes("REMEMBER")) {
        currentMode = "REMEMBER";

        fadeImage(0, 1000);

        setTimeout(() => {
          showMessage("... I hold on to what once was");
        }, 3000);
      }
    }

    // Listen for messages from the physical buttons via ntfy.
    const ntfyUrl =
      "https://ntfy.sh/box-of-memories-urk123/sse";

    const eventSource = new EventSource(ntfyUrl);

    eventSource.onopen = () => {
      setStatus("Connected — point camera at the marker");
      console.log("Connected to ntfy");
    };

    eventSource.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        processMessage(data);
      } catch (error) {
        console.error("Could not read ntfy message:", error);
      }
    };

    eventSource.onerror = (error) => {
      console.error("ntfy connection error:", error);
      setStatus("Connecting to buttons...");
    };

    // AR and camera status updates.
    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", () => {
      setStatus("AR scene loaded — starting camera...");
    });

    window.addEventListener("camera-init", () => {
      setStatus("Camera ready — loading image marker...");
    });

    window.addEventListener("camera-error", () => {
      setStatus("Camera error — check camera permissions");
    });

    window.addEventListener("arjs-nft-loaded", () => {
      setStatus("Marker loaded — point camera at image");
    });

    window.addEventListener("error", (event) => {
      console.error("JavaScript error:", event.message);
      setStatus("Error loading AR — check browser console");
    });

    // Start with the image hidden.
    setImageOpacity(0);
  </script>
</body>
</html>
