```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories - AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 14px;
      max-width: 75%;
    }

    #connect-serial {
      position: fixed;
      top: 65px;
      left: 12px;
      z-index: 101;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
      color: #111111;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="status">REMEMBER — normale foto zichtbaar</div>
  <button id="connect-serial">Verbind Arduino</button>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; colorManagement: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <img
        id="scary-image"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <a-plane
        id="scary-overlay"
        position="40 30 0"
        rotation="-90 0 0"
        width="80"
        height="50"
        visible="false"
        material="
          shader: flat;
          src: #scary-image;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("#foto-marker");
    const overlay = document.querySelector("#scary-overlay");
    const image = document.querySelector("#scary-image");
    const status = document.querySelector("#status");
    const connectButton = document.querySelector("#connect-serial");

    const FADE_DURATION = 1200;

    // Begin altijd in REMEMBER-modus.
    let plaagActief = false;
    let markerZichtbaar = false;
    let fadeFrame = null;
    let serialReader = null;

    function setOpacity(value) {
      overlay.setAttribute("material", "opacity", value);
    }

    function stopFade() {
      if (fadeFrame !== null) {
        cancelAnimationFrame(fadeFrame);
        fadeFrame = null;
      }
    }

    function verbergAfbeelding() {
      stopFade();
      setOpacity(0);
      overlay.setAttribute("visible", false);
    }

    function fadeIn() {
      stopFade();

      overlay.setAttribute("visible", true);
      setOpacity(0);

      const startTime = performance.now();

      function animate(now) {
        // Stop wanneer ACCEPT niet meer actief is
        // of de marker uit beeld verdwenen is.
        if (!plaagActief || !markerZichtbaar) {
          fadeFrame = null;
          verbergAfbeelding();
          return;
        }

        const progress = Math.min(
          (now - startTime) / FADE_DURATION,
          1
        );

        // Soepele fade-in
        const eased = progress * progress * (3 - 2 * progress);
        setOpacity(eased);

        if (progress < 1) {
          fadeFrame = requestAnimationFrame(animate);
        } else {
          setOpacity(1);
          fadeFrame = null;
        }
      }

      fadeFrame = requestAnimationFrame(animate);
    }

    // Bepaal of de AR-afbeelding zichtbaar mag zijn.
    function updateAR() {
      if (plaagActief && markerZichtbaar) {
        status.textContent = "ACCEPT — de plaag is begonnen";
        fadeIn();
      } else {
        verbergAfbeelding();

        if (plaagActief) {
          status.textContent = "ACCEPT actief — zoek de marker";
        } else {
          status.textContent = "REMEMBER — normale foto zichtbaar";
        }
      }
    }

    // Arduino-berichten verwerken.
    function verwerkBericht(bericht) {
      bericht = bericht.trim();

      console.log("Arduino:", bericht);

      if (bericht === "ACCEPT||1") {
        plaagActief = true;
        updateAR();
      }

      if (bericht === "REMEMBER||1") {
        plaagActief = false;
        updateAR();
      }
    }

    // Verbind via USB met de Arduino.
    async function verbindArduino() {
      if (!("serial" in navigator)) {
        status.textContent =
          "Web Serial niet beschikbaar. Gebruik Chrome of Edge op een computer.";
        return;
      }

      try {
        const port = await navigator.serial.requestPort();

        await port.open({ baudRate: 9600 });

        connectButton.textContent = "Arduino verbonden";
        connectButton.disabled = true;

        status.textContent =
          "Arduino verbonden — REMEMBER-modus actief";

        // Lees seriële tekstregels van de Arduino.
        const decoder = new TextDecoderStream();
        const readableClosed = port.readable.pipeTo(decoder.writable);
        serialReader = decoder.readable.getReader();

        let buffer = "";

        try {
          while (true) {
            const { value, done } = await serialReader.read();

            if (done) break;

            buffer += value;

            const regels = buffer.split(/\r?\n/);
            buffer = regels.pop() || "";

            for (const regel of regels) {
              if (regel.trim()) {
                verwerkBericht(regel);
              }
            }
          }
        } finally {
          serialReader.releaseLock();
          await readableClosed.catch(() => {});
        }
      } catch (error) {
        console.error("Seriële verbinding:", error);
        status.textContent =
          "Verbinding mislukt. Controleer USB, poort en seriële instellingen.";
      }
    }

    connectButton.addEventListener("click", verbindArduino);

    // Marker herkend: toon de afbeelding alleen als ACCEPT actief is.
    marker.addEventListener("markerFound", function () {
      markerZichtbaar = true;
      updateAR();
    });

    // Marker verloren: verberg de AR-afbeelding.
    // De ACCEPT-status blijft behouden.
    marker.addEventListener("markerLost", function () {
      markerZichtbaar = false;
      updateAR();
    });

    image.addEventListener("load", function () {
      console.log("AR-afbeelding geladen.");
    });

    image.addEventListener("error", function () {
      status.textContent = "De AR-afbeelding kon niet worden geladen.";
      console.error("Afbeelding laden mislukt:", image.src);
    });

    // Verberg de AR-afbeelding bij het opstarten.
    verbergAfbeelding();
  </script>
</body>
</html>
