```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10000;
      background: #222;
      color: white;
      padding: 12px;
      font: 16px Arial, sans-serif;
      border-radius: 6px;
    }

    /* Afbeelding boven op de camerabeelden */
    #scary-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 9000;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="status">AR wordt geladen...</div>

  <!-- Schermvullende afbeelding boven op de camera -->
  <img
    id="scary-screen"
    src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
    alt="De enge herinnering">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- Je bestaande NFT-marker blijft behouden -->
    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- Bestaande objecten -->
      <a-sphere
        position="100 150 0"
        radius="25"
        color="#8b1e3f">
      </a-sphere>

      <a-sphere
        position="200 220 0"
        radius="18"
        color="#24152f">
      </a-sphere>

      <a-sphere
        position="280 120 0"
        radius="22"
        color="#151515">
      </a-sphere>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const marker = document.getElementById("foto-marker");
    const scaryScreen = document.getElementById("scary-screen");

    // Controleer of de enge afbeelding geladen is
    scaryScreen.addEventListener("load", function () {
      console.log("Enge afbeelding geladen.");
    });

    scaryScreen.addEventListener("error", function () {
      status.textContent =
        "Fout: de enge afbeelding kon niet worden geladen.";
    });

    // AR.js geladen
    window.addEventListener("arjs-nft-loaded", function () {
      status.textContent =
        "Marker geladen! Richt de camera op je foto.";
    });

    // Marker herkend: toon afbeelding op het camerascherm
    marker.addEventListener("markerFound", function () {
      status.textContent = "FOTO HERKEND!";
      scaryScreen.style.display = "block";
    });

    // Marker verloren: verberg afbeelding
    marker.addEventListener("markerLost", function () {
      status.textContent = "Foto niet meer zichtbaar.";
      scaryScreen.style.display = "none";
    });

    window.addEventListener("error", function (event) {
      status.textContent = "Fout: " + event.message;
    });
  </script>

</body>
</html>
