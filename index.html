```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories - AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js NFT tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font: 14px Arial, sans-serif;
    }
  </style>
</head>

<body>
  <div id="status">Camera wordt gestart...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; colorManagement: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- Afbeelding laden -->
    <a-assets>
      <img
        id="scary-image"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- NFT-marker -->
    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- Afbeelding horizontaal boven het A4-papier -->
      <a-plane
        id="scary-overlay"
        position="0 0 1"
        rotation="-90 180 90"
        width="100"
        height="100"
        visible="false"
        material="
          shader: flat;
          src: #scary-image;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>

    </a-nft>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("#foto-marker");
    const overlay = document.querySelector("#scary-overlay");
    const image = document.querySelector("#scary-image");
    const status = document.querySelector("#status");

    const FADE_DURATION = 1200;

    let markerVisible = false;
    let fadeFrame = null;

    function stopFade() {
      if (fadeFrame !== null) {
        cancelAnimationFrame(fadeFrame);
        fadeFrame = null;
      }
    }

    function setOpacity(value) {
      overlay.setAttribute("material", "opacity", value);
    }

    // Fade-in wanneer de marker wordt herkend
    function fadeIn() {
      stopFade();

      markerVisible = true;
      overlay.setAttribute("visible", true);
      setOpacity(0);

      const startTime = performance.now();

      function animate(now) {
        if (!markerVisible) {
          fadeFrame = null;
          return;
        }

        const progress = Math.min(
          (now - startTime) / FADE_DURATION,
          1
        );

        // Soepele overgang van transparant naar zichtbaar
        const eased = progress * progress * (3 - 2 * progress);

        setOpacity(eased);

        if (progress < 1) {
          fadeFrame = requestAnimationFrame(animate);
        } else {
          setOpacity(1);
          fadeFrame = null;
        }
      }

      fadeFrame = requestAnimationFrame(animate);
    }

    // Marker herkend
    marker.addEventListener("markerFound", function () {
      if (markerVisible) return;

      status.textContent = "Marker herkend!";
      fadeIn();
    });

    // Marker niet meer zichtbaar
    marker.addEventListener("markerLost", function () {
      markerVisible = false;
      stopFade();

      setOpacity(0);
      overlay.setAttribute("visible", false);

      status.textContent = "Richt de camera op het A4-papier";
    });

    // Afbeelding geladen
    image.addEventListener("load", function () {
      console.log("Afbeelding geladen:", image.src);
      status.textContent = "Afbeelding geladen — zoek de marker";
    });

    // Fout bij het laden van de afbeelding
    image.addEventListener("error", function () {
      status.textContent = "Afbeelding kon niet worden geladen";
      console.error("Afbeelding niet geladen:", image.src);
    });

    window.addEventListener("load", function () {
      status.textContent = "Richt de camera op de marker";
    });
  </script>
</body>
</html>
