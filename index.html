```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Box of Memories - AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js NFT tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 14px;
      max-width: 80%;
    }

    #connect-serial {
      position: fixed;
      top: 65px;
      left: 12px;
      z-index: 101;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #111;
      font-size: 14px;
      cursor: pointer;
    }

    #connect-serial:disabled {
      opacity: 0.7;
      cursor: default;
    }
  </style>
</head>

<body>
  <div id="status">REMEMBER — normale foto zichtbaar</div>
  <button id="connect-serial">Verbind Arduino</button>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; colorManagement: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <img
        id="scary-image"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- NFT-marker -->
    <a-nft
      id="foto-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <!-- Jouw ingestelde positie, rotatie en afmetingen -->
      <a-plane
        id="scary-overlay"
        position="40 30 0"
        rotation="-90 0 0"
        width="80"
        height="50"
        visible="false"
        material="
          shader: flat;
          src: #scary-image;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("#foto-marker");
    const overlay = document.querySelector("#scary-overlay");
    const image = document.querySelector("#scary-image");
    const status = document.querySelector("#status");
    const connectButton = document.querySelector("#connect-serial");

    const FADE_DURATION = 1200;

    // Begin altijd in REMEMBER-modus.
    let plaagActief = false;
    let markerZichtbaar = false;
    let fadeFrame = null;

    // Arduino-seriële verbinding.
    let serialPort = null;
    let serialReader = null;
    let serialBuffer = "";

    function setOpacity(value) {
      overlay.setAttribute("material", "opacity", value);
    }

    function stopFade() {
      if (fadeFrame !== null) {
        cancelAnimationFrame(fadeFrame);
        fadeFrame = null;
      }
    }

    // Vloeiende fade-in.
    function fadeIn() {
      stopFade();

      if (!plaagActief || !markerZichtbaar) {
        fadeOut();
        return;
      }

      overlay.setAttribute("visible", true);
      setOpacity(0);

      const startTime = performance.now();

      function animate(now) {
        if (!plaagActief || !markerZichtbaar) {
          fadeFrame = null;
          fadeOut();
          return;
        }

        const progress = Math.min(
          (now - startTime) / FADE_DURATION,
          1
        );

        // Smoothstep voor een zachte overgang.
        const eased = progress * progress * (3 - 2 * progress);

        setOpacity(eased);

        if (progress < 1) {
          fadeFrame = requestAnimationFrame(animate);
        } else {
          setOpacity(1);
          fadeFrame = null;
        }
      }

      fadeFrame = requestAnimationFrame(animate);
    }

    // Vloeiende fade-out.
    function fadeOut() {
      stopFade();

      const material = overlay.getAttribute("material");
      const startOpacity = material
        ? Number(material.opacity)
        : 0;

      if (
        !overlay.getAttribute("visible") ||
        startOpacity <= 0
      ) {
        setOpacity(0);
        overlay.setAttribute("visible", false);
        return;
      }

      const startTime = performance.now();

      function animate(now) {
        const progress = Math.min(
          (now - startTime) / FADE_DURATION,
          1
        );

        const eased = progress * progress * (3 - 2 * progress);

        setOpacity(startOpacity * (1 - eased));

        if (progress < 1) {
          fadeFrame = requestAnimationFrame(animate);
        } else {
          setOpacity(0);
          overlay.setAttribute("visible", false);
          fadeFrame = null;
        }
      }

      fadeFrame = requestAnimationFrame(animate);
    }

    // Pas de afbeelding aan de huidige toestand aan.
    function updateAR() {
      if (plaagActief && markerZichtbaar) {
        status.textContent =
          "ACCEPT — de plaag is begonnen";
        fadeIn();
      } else {
        fadeOut();

        if (plaagActief) {
          status.textContent =
            "ACCEPT actief — zoek de marker";
        } else {
          status.textContent =
            "REMEMBER — normale foto zichtbaar";
        }
      }
    }

    // Arduino-berichten verwerken.
    function verwerkBericht(bericht) {
      bericht = bericht.trim();

      if (!bericht) return;

      console.log("Arduino:", bericht);

      if (bericht === "ACCEPT||1") {
        plaagActief = true;
        updateAR();
      } else if (bericht === "REMEMBER||1") {
        plaagActief = false;
        updateAR();
      }
    }

    // Verbind de Arduino via Web Serial.
    async function verbindArduino() {
      if (!("serial" in navigator)) {
        status.textContent =
          "Web Serial niet beschikbaar. Gebruik Chrome of Edge op HTTPS.";
        return;
      }

      try {
        connectButton.disabled = true;
        status.textContent = "Selecteer de Arduino-poort...";

        serialPort = await navigator.serial.requestPort();

        // Moet overeenkomen met Serial.begin(9600).
        await serialPort.open({ baudRate: 9600 });

        status.textContent =
          "Arduino verbonden — REMEMBER-modus";
        connectButton.textContent = "Arduino verbonden";

        const decoder = new TextDecoderStream();
        const readableClosed =
          serialPort.readable.pipeTo(decoder.writable);

        serialReader = decoder.readable.getReader();
        serialBuffer = "";

        try {
          while (true) {
            const { value, done } = await serialReader.read();

            if (done) break;

            serialBuffer += value;

            const regels = serialBuffer.split(/\r?\n/);
            serialBuffer = regels.pop() || "";

            for (const regel of regels) {
              verwerkBericht(regel);
            }
          }
        } finally {
          serialReader.releaseLock();
          await readableClosed.catch(() => {});
        }
      } catch (error) {
        console.error("Arduino-verbinding mislukt:", error);

        status.textContent =
          "Verbinding mislukt: " +
          (error.message || "controleer de poort en USB-verbinding");

        connectButton.disabled = false;
        connectButton.textContent = "Opnieuw verbinden";
      }
    }

    connectButton.addEventListener("click", verbindArduino);

    // Marker herkend.
    marker.addEventListener("markerFound", function () {
      markerZichtbaar = true;
      updateAR();
    });

    // Marker verloren.
    marker.addEventListener("markerLost", function () {
      markerZichtbaar = false;
      updateAR();
    });

    // Controleer of de afbeelding geladen is.
    image.addEventListener("load", function () {
      console.log("AR-afbeelding geladen:", image.src);
    });

    image.addEventListener("error", function () {
      status.textContent =
        "De AR-afbeelding kon niet worden geladen.";
      console.error("Afbeelding laden mislukt:", image.src);
    });

    // Extra bescherming: start onzichtbaar.
    verbergBijStart();

    function verbergBijStart() {
      stopFade();
      setOpacity(0);
      overlay.setAttribute("visible", false);
    }

    // Bij het sluiten van de pagina de lezer opruimen.
    window.addEventListener("pagehide", async function () {
      try {
        if (serialReader) {
          await serialReader.cancel();
        }
      } catch (error) {
        console.warn("Seriële lezer afsluiten:", error);
      }

      try {
        if (serialPort && serialPort.readable) {
          await serialPort.close();
        }
      } catch (error) {
        console.warn("Seriële poort afsluiten:", error);
      }
    });
  </script>
</body>
</html>
