<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box of Memories</title>
  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
    #camera {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover;
    }
    #scary {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover;
      opacity:0;
      transition:opacity 1.5s ease-in;
      pointer-events:none;
    }
    #scary.aan { opacity:1; }
    #status {
      position:fixed; top:10px; left:10px; z-index:10;
      background:rgba(0,0,0,0.6); color:white; padding:8px 12px;
      font:14px Arial; border-radius:6px;
    }
  </style>
</head>
<body>

  <video id="camera" autoplay playsinline muted></video>
  <img
  id="scary"
  src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
  alt="Karrekiens afbeelding">
  <div id="status">Camera starten...</div>

  <script>
    const status = document.getElementById("status");
    const camera = document.getElementById("camera");
    const scary = document.getElementById("scary");

    // ===== Camera =====
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    }).then(function (stream) {
      camera.srcObject = stream;
      status.textContent = "Camera aan.";
      setTimeout(function () { status.style.display = "none"; }, 3000);
    }).catch(function (err) {
      status.textContent = "Camera-fout: " + err.message;
    });

    // ===== Arduino-koppeling =====
    // Vervang door JOUW geheime naam (zelfde als in controller.html)
    const TOPIC = "box-of-memories-urk123";

    const bron = new EventSource("https://ntfy.sh/" + TOPIC + "/sse");

    bron.onmessage = function (e) {
      try {
        const data = JSON.parse(e.data);
        if (data.event !== "message") return;

        if (data.message === "ACCEPT") {
          scary.classList.add("aan");
        } else if (data.message === "REMEMBER") {
          scary.classList.remove("aan");
        }
      } catch (err) {
        status.style.display = "block";
        status.textContent = "Fout: " + err.message;
      }
    };
  </script>

</body>
</html>
