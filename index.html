<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box of Memories</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

  <div id="status" style="
    position:fixed; top:10px; left:10px; z-index:9999;
    background:#222; color:white; padding:12px;
    font:16px Arial; border-radius:6px;">
    AR wordt geladen...
  </div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="marker" mindar-image-target="targetIndex: 0">
      <a-image
        id="scary"
        src="karrekienscary800.jpg"
        width="1" height="0.625"
        position="0 0 0.01"
        visible="false">
      </a-image>
    </a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const marker = document.getElementById("marker");
    const scary = document.getElementById("scary");

    marker.addEventListener("targetFound", function () {
      status.textContent = "FOTO HERKEND!";
    });
    marker.addEventListener("targetLost", function () {
      status.textContent = "Foto niet meer zichtbaar.";
    });

    // ===== Arduino-koppeling =====
    const TOPIC = "box-of-memories-urk123";

    const bron = new EventSource("https://ntfy.sh/" + TOPIC + "/sse");

    bron.onmessage = function (e) {
      try {
        const data = JSON.parse(e.data);
        if (data.event !== "message") return;

        if (data.message === "ACCEPT") {
          scary.setAttribute("visible", "true");
        } else if (data.message === "REMEMBER") {
          scary.setAttribute("visible", "false");
        }
      } catch (err) {
        status.textContent = "Fout: " + err.message;
      }
    };
  </script>

</body>
</html>
