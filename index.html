
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Box of Memories</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js NFT tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 8px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      font-size: 14px;
      line-height: 1.4;
      pointer-events: none;
    }

    #status.error {
      background: rgba(150, 0, 0, 0.85);
    }
  </style>
</head>

<body>

  <div id="status">Box of Memories wordt gestart...</div>

  <!-- Afbeelding laden -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <img
        id="scary-image"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- Bestaande NFT-marker -->
    <a-nft
      id="memory-marker"
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >

      <!-- Bestaande positie en afmetingen behouden -->
      <a-plane
        id="scary-overlay"
        position="40 30 0"
        rotation="-90 0 0"
        width="80"
        height="50"
        visible="false"
        material="
          shader: flat;
          src: #scary-image;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "
      ></a-plane>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    // ==========================================
    // BOX OF MEMORIES - NTfy verbinding
    // ==========================================

    const NTFY_TOPIC = "box-of-memories-urk123";
    const NTFY_URL =
      "https://ntfy.sh/" + NTFY_TOPIC + "/json?since=now";

    const overlay = document.querySelector("#scary-overlay");
    const marker = document.querySelector("#memory-marker");
    const statusBox = document.querySelector("#status");

    let accepted = false;
    let markerVisible = false;
    let animationToken = 0;

    function setStatus(message, error = false) {
      statusBox.textContent = message;
      statusBox.classList.toggle("error", error);
    }

    // ==========================================
    // AFBEELDING IN- EN UITFADEN
    // ==========================================

    function fadeOverlay(show) {
      if (!overlay) return;

      const token = ++animationToken;

      if (show) {
        overlay.setAttribute("visible", true);
      }

      const material = overlay.getAttribute("material") || {};
      const startOpacity = Number(material.opacity ?? 0);
      const endOpacity = show ? 1 : 0;
      const duration = 1200;
      const startTime = performance.now();

      function animate(now) {
        // Stop een eerdere animatie als een nieuw bericht komt.
        if (token !== animationToken) return;

        const progress = Math.min(
          (now - startTime) / duration,
          1
        );

        // Soepele fade
        const eased =
          progress * progress * (3 - 2 * progress);

        const opacity =
          startOpacity +
          (endOpacity - startOpacity) * eased;

        overlay.setAttribute("material", "opacity", opacity);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else if (!show) {
          overlay.setAttribute("visible", false);
        }
      }

      requestAnimationFrame(animate);
    }

    function updateOverlay() {
      fadeOverlay(accepted && markerVisible);
    }

    // ==========================================
    // NFT-MARKER GEVONDEN OF VERLOREN
    // ==========================================

    marker.addEventListener("markerFound", () => {
      markerVisible = true;
      setStatus(
        accepted
          ? "Marker gevonden — herinnering actief"
          : "Marker gevonden — wacht op ACCEPT"
      );
      updateOverlay();
    });

    marker.addEventListener("markerLost", () => {
      markerVisible = false;
      setStatus("Marker niet zichtbaar");
      updateOverlay();
    });

    // ==========================================
    // NTfy BERICHTEN ONTVANGEN
    // ==========================================

    async function listenToNtfy() {
      while (true) {
        let reader;

        try {
          setStatus("Verbinden met ntfy...");

          const response = await fetch(NTFY_URL, {
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error("ntfy HTTP " + response.status);
          }

          if (!response.body) {
            throw new Error("De browser ondersteunt deze stream niet.");
          }

          reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          setStatus("Verbonden met ntfy — wacht op knoppen");

          while (true) {
            const result = await reader.read();

            if (result.done) break;

            buffer += decoder.decode(result.value, {
              stream: true
            });

            const lines = buffer.split("\n");
            buffer = lines.pop() || "";

            for (const line of lines) {
              if (!line.trim()) continue;

              let event;

              try {
                event = JSON.parse(line);
              } catch {
                continue;
              }

              if (event.event !== "message") continue;

              const message = String(event.message || "")
                .trim()
                .toUpperCase();

              if (message === "ACCEPT") {
                accepted = true;

                setStatus(
                  markerVisible
                    ? "ACCEPT — herinnering verschijnt"
                    : "ACCEPT ontvangen — zoek de marker"
                );

                updateOverlay();
                console.log("ntfy: ACCEPT ontvangen");
              }

              if (message === "REMEMBER") {
                accepted = false;

                setStatus("REMEMBER — herinnering verborgen");

                updateOverlay();
                console.log("ntfy: REMEMBER ontvangen");
              }
            }
          }

        } catch (error) {
          console.error("ntfy-verbinding:", error);

          setStatus(
            "Verbinding verbroken — opnieuw proberen...",
            true
          );

        } finally {
          if (reader) {
            try {
              await reader.cancel();
            } catch (_) {
              // De verbinding kan al gesloten zijn.
            }
          }
        }

        // Opnieuw verbinden na een onderbreking.
        await new Promise(resolve => setTimeout(resolve, 2000));
      }
    }

    // Start luisteren naar ntfy.
    listenToNtfy();
  </script>

</body>
</html>
