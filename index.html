<body>
  <div id="status">Camera starten...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <img
        id="scaryTexture"
        src="https://cael4s.github.io/box-of-memories/images/karrekienscary800.jpg"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- Bestaande NFT-marker: deze URL niet veranderen -->
    <a-nft
      type="nft"
      url="https://cael4s.github.io/box-of-memories/markers/karrekien800"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <!-- Afbeelding gekoppeld aan de marker -->
      <a-image
        id="scary"
        src="#scaryTexture"
        width="1.6"
        height="1"
        position="0 0 0.01"
        visible="false"
        material="shader: flat; transparent: true; opacity: 0; side: double"
        animation__in="property: material.opacity; from: 0; to: 1; dur: 1500; startEvents: fadein"
        animation__out="property: material.opacity; from: 1; to: 0; dur: 1500; startEvents: fadeout"
      ></a-image>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

<script>
  const scary = document.getElementById("scary");
  const status = document.getElementById("status");

  const TOPIC = "box-of-memories-urk123";
  const bron = new EventSource(
    "https://ntfy.sh/" + TOPIC + "/sse"
  );

  let verbergTimer;

  // ACCEPT en REMEMBER via ntfy
  bron.onmessage = function (e) {
    try {
      const data = JSON.parse(e.data);

      if (data.event !== "message") return;

      if (data.message === "ACCEPT") {
        clearTimeout(verbergTimer);

        scary.setAttribute("visible", true);
        scary.emit("fadein");
      }

      if (data.message === "REMEMBER") {
        scary.emit("fadeout");

        verbergTimer = setTimeout(function () {
          scary.setAttribute("visible", false);
        }, 1500);
      }
    } catch (err) {
      status.style.display = "block";
      status.textContent = "Fout: " + err.message;
    }
  };

  bron.onerror = function () {
    status.style.display = "block";
    status.textContent = "Verbinding met ntfy wordt hersteld...";
  };
</script>
